name: Пересылка фотографий в Discord

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: photo-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  send-photo:
    if: contains(github.event.issue.labels.*.name, 'photo-upload')
    runs-on: ubuntu-latest
    steps:
      - name: Получить код обработчика
        uses: actions/checkout@v4

      - name: Отправить фотографию в Discord
        id: send
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/send_photo_to_discord.py

      - name: Сообщить об успехе и закрыть заявку
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue.number;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: '✅ Фотография успешно отправлена в Discord. Спасибо!'
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: number,
              state: 'closed'
            });

      - name: Сообщить об ошибке
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body: '❌ Не удалось автоматически отправить фотографию. Проверь, что вложение загружено в поле формы, а администратор настроил Discord Webhook и GitHub Actions. Можно попробовать создать новую заявку.'
            });
